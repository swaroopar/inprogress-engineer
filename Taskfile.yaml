# https://taskfile.dev

version: '3'

tasks:
    format-lint:
        desc: run all lint commands together
        cmds:
            - npx prettier --config .prettierrc --write .
            - npx eslint . --max-warnings=0
            - npx knip

    vale-lint:
        cmds:
            - docker run --rm -v $(pwd)/.github/vale/styles:/styles --pull=always --rm -v $(pwd):/docs -w /docs jdkato/vale --glob='!.github/vale/styles/**' .

    check-theme-image:
        desc: Check that all Excalidraw images use ThemeImage component
        cmds:
            - node scripts/check-theme-image-usage.mjs

    check-links:
        desc: check no broken links
        cmd: npm run build

    build:
        desc: Run all tasks required for a full clean build
        # It's fine to run these tasks in parallel.
        deps:
            - format-lint
            - vale-lint
            - check-theme-image
            - check-links
